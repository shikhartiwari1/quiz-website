<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCQ Quiz</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .quiz-container {
            background: #fff;
            border-radius: 8px;
            padding: 30px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .progress {
            font-size: 14px;
            color: #777;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        .question {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 30px;
            line-height: 1.5;
            text-align: center;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            padding: 15px;
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
            text-align: left;
            width: 100%;
            outline: none;
        }

        .option-btn:hover:not(:disabled) {
            background: #e9ecef;
            border-color: #adb5bd;
        }

        .option-btn.selected {
            border-color: #3498db;
            background: #ebf5fb;
        }

        .option-btn.correct {
            background: #d4edda !important;
            border-color: #2ecc71 !important;
            color: #155724;
        }

        .option-btn.wrong {
            background: #f8d7da !important;
            border-color: #e74c3c !important;
            color: #721c24;
        }

        .option-btn:disabled {
            cursor: not-allowed;
        }

        .feedback {
            font-size: 18px;
            font-weight: bold;
            height: 25px;
            margin-bottom: 20px;
            text-align: center;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
        }

        .nav-btn {
            padding: 10px 20px;
            border: none;
            background: #3498db;
            color: #fff;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.2s;
            min-width: 110px;
        }

        .nav-btn:hover:not(:disabled) {
            background: #2980b9;
        }

        .nav-btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
        }

        #result-screen {
            display: none;
            text-align: center;
        }

        .score-text {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .details-text {
            font-size: 18px;
            color: #555;
            margin-bottom: 20px;
        }

        .final-msg {
            font-size: 28px;
            font-weight: bold;
            margin: 20px 0;
        }

        /* Mobile adjustments */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .quiz-container {
                padding: 20px;
            }

            .question {
                font-size: 18px;
            }

            .option-btn {
                font-size: 14px;
                padding: 12px;
            }

            .nav-btn {
                min-width: 90px;
                padding: 10px 15px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="quiz-container">
        <div id="quiz-screen">
            <div class="progress" id="progress"></div>
            <div class="question" id="question-text"></div>
            <div class="options" id="options"></div>
            <div class="feedback" id="feedback"></div>
            <div class="nav-buttons">
                <button class="nav-btn" id="prev-btn" onclick="prevQuestion()">Previous</button>
                <button class="nav-btn" id="next-btn" onclick="nextQuestion()">Next</button>
            </div>
        </div>

        <div id="result-screen">
            <h2>Quiz Completed!</h2>
            <div class="score-text" id="score-text"></div>
            <div class="details-text" id="details-text"></div>
            <div class="final-msg" id="final-msg"></div>
            <button class="nav-btn" onclick="initQuiz()" style="margin-top: 15px;">Restart Quiz</button>
        </div>
    </div>

        let questions = [];
        let currentIndex = 0;
        let score = 0;
        let correctCount = 0;
        let incorrectCount = 0;
        let locked = false;
        let autoNextTimeout;

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function initQuiz() {
            document.getElementById('result-screen').style.display = 'none';
            document.getElementById('quiz-screen').style.display = 'block';

            // Deep copy original questions to not mutate original dataset
            questions = JSON.parse(JSON.stringify(originalQuestions));
            shuffleArray(questions);

            // Shuffle options in each question and clear selected states
            questions.forEach(q => {
                shuffleArray(q.options);
                q.userAnswered = null;
            });

            currentIndex = 0;
            score = 0;
            correctCount = 0;
            incorrectCount = 0;

            loadQuestion();
        }

        function loadQuestion() {
            const q = questions[currentIndex];
            locked = q.userAnswered !== null;

            document.getElementById('progress').innerText = `Question ${currentIndex + 1} of ${questions.length}`;

            // Clean display: optionally stripping prefixes because they look messy when shuffled
            const cleanQuestion = q.question.replace(/^\d+\.\s+/, '');
            document.getElementById('question-text').innerText = cleanQuestion;

            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';

            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';

                const cleanOpt = opt.replace(/^[a-d]\.\s+/, '');
                btn.innerText = cleanOpt;

                btn.onclick = () => selectOption(btn, opt, q.answer);

                // Resume locked state correctly if navigating history
                if (locked) {
                    btn.disabled = true;
                    if (opt === q.answer) {
                        btn.classList.add('correct');
                    } else if (opt === q.userAnswered) {
                        btn.classList.add('wrong');
                    }
                }

                optionsDiv.appendChild(btn);
            });

            const feedback = document.getElementById('feedback');
            if (locked) {
                if (q.userAnswered === q.answer) {
                    feedback.innerText = 'Correct!';
                    feedback.style.color = '#2ecc71';
                } else {
                    feedback.innerText = 'Wrong!';
                    feedback.style.color = '#e74c3c';
                }
            } else {
                feedback.innerText = '';
            }

            document.getElementById('prev-btn').disabled = (currentIndex === 0);

            const nextBtn = document.getElementById('next-btn');
            if (currentIndex === questions.length - 1) {
                nextBtn.innerText = 'Submit';
            } else {
                nextBtn.innerText = 'Next';
            }
            // User must select an answer to move forward
            nextBtn.disabled = !locked;
        }

        function selectOption(btn, selected, correct) {
            if (locked) return;
            locked = true;

            const q = questions[currentIndex];
            q.userAnswered = selected;

            document.getElementById('next-btn').disabled = false;
            btn.classList.add('selected');

            const cleanCorrect = correct.replace(/^[a-d]\.\s+/, '');

            const optionsDiv = document.getElementById('options');
            Array.from(optionsDiv.children).forEach(child => {
                child.disabled = true;
                if (child.innerText === cleanCorrect) {
                    child.classList.add('correct');
                }
            });

            const feedback = document.getElementById('feedback');
            if (selected === correct) {
                score++;
                correctCount++;
                feedback.innerText = 'Correct!';
                feedback.style.color = '#2ecc71';
            } else {
                btn.classList.add('wrong');
                incorrectCount++;
                feedback.innerText = 'Wrong!';
                feedback.style.color = '#e74c3c';
            }

            // Automatically advance to the next question
            autoNextTimeout = setTimeout(() => {
                nextQuestion();
            }, 1200);
        }

        function nextQuestion() {
            clearTimeout(autoNextTimeout);
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                showResult();
            }
        }

        function prevQuestion() {
            clearTimeout(autoNextTimeout);
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function showResult() {
            document.getElementById('quiz-screen').style.display = 'none';
            const resScreen = document.getElementById('result-screen');
            resScreen.style.display = 'block';

            document.getElementById('score-text').innerText = `You scored ${score} out of ${questions.length}`;
            document.getElementById('details-text').innerText = `Correct: ${correctCount} | Incorrect: ${incorrectCount}`;

            const finalMsg = document.getElementById('final-msg');
            if (score >= 70) {
                finalMsg.innerText = 'Excellent';
                finalMsg.style.color = '#2ecc71';
            } else if (score >= 50) {
                finalMsg.innerText = 'Good';
                finalMsg.style.color = '#f1c40f';
            } else {
                finalMsg.innerText = 'Needs Improvement';
                finalMsg.style.color = '#e74c3c';
            }
        }

        // Start immediately
        initQuiz();
    </script>
